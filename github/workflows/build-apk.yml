
name: Build PodPedi APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          unzip -q PodPedi-Android-Projeto-Atualizado.zip -d workdir
          test -f workdir/PodPedi-Android/build.gradle

      - name: Gerar APK
        working-directory: workdir/PodPedi-Android
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PodPedi-Entregas-APK
          path: workdir/PodPedi-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
